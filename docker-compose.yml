services:
  api:
    build: .
    image: gzip-ndjson-api:latest
    command: sh -c "python -m app.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/batches.db
    volumes:
      - gzip_ndjson_data:/data
    restart: unless-stopped

volumes:
  gzip_ndjson_data:
